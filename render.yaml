# Render Blueprint: the whole deployment in one file (ADR-0011).
#
# Two web services and one database. Render reads this when the repository is connected as a
# Blueprint, so neither service is configured by clicking around a dashboard, and the configuration
# is reviewed in pull requests like any other code.
#
#   hyntor-web    Django site: sign-in, courses, library. Public entry point.
#   hyntor-tutor  Streamlit tutor. Reachable only with a signed hand-off token from hyntor-web.
#   hyntor-db     PostgreSQL, used by hyntor-web.
#
# Two values are NOT in this file and must be set by hand in the Render dashboard, because secrets
# do not belong in a repository (sync: false below means "ask me for this"):
#   SEED_PASSWORD         on hyntor-web    password for the demo accounts on the public site
#   GOOGLE_CLIENT_ID      on hyntor-web    sign in with Google (optional; hides the button if unset)
#   GOOGLE_CLIENT_SECRET  on hyntor-web
#   GEMINI_API_KEY        on hyntor-tutor
#
# Continuous deployment (#13): both services deploy from main, and only after GitHub reports that
# the ci workflow passed on that commit (autoDeployTrigger: checksPass). A red build never ships.
#
# Everything else, including the shared hand-off secret and the two services' addresses, is wired
# up automatically by the references below.

databases:
  - name: hyntor-db
    databaseName: hyntor
    user: hyntor
    plan: free

services:
  # ---------------------------------------------------------------- Django site
  - type: web
    name: hyntor-web
    runtime: python
    plan: free
    region: oregon
    # Deploy each commit on main once its CI checks pass; a failing commit is never deployed.
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --no-input &&
      python manage.py migrate --no-input &&
      python manage.py seed --password "${SEED_PASSWORD:?Set SEED_PASSWORD on hyntor-web in the Render dashboard}"
    # Gunicorn serves the application; whitenoise serves the static files from inside it.
    startCommand: gunicorn hyntor.wsgi:application --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.15"
      - key: DATABASE_URL
        fromDatabase:
          name: hyntor-db
          property: connectionString
      # Render generates this once and keeps it. Nobody, including us, needs to see it.
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      # The shared secret for the hand-off token. Generated here and read by the tutor service
      # below, so the two always agree and the value never appears in the repository.
      - key: HANDOFF_SECRET
        generateValue: true
      # The tutor's PUBLIC address, because the browser is what follows this redirect.
      # Do NOT use `fromService ... property: host` here: that yields Render's internal hostname,
      # which only resolves inside Render's private network. A browser sent there gets "page not
      # found". Update this if the tutor service is ever renamed.
      - key: TUTOR_CHAT_URL
        value: https://hyntor-tutor.onrender.com
      # Password for the demo accounts the build seeds (there is no signup page yet). Not the README's
      # demo password: this site is public and one of the accounts is an admin. The build stops if it
      # is unset. Seeding is idempotent and only sets passwords on accounts it creates, so changing
      # this later does not change existing accounts.
      - key: SEED_PASSWORD
        sync: false
      # Sign in with Google (ADR-0012). Set both in the dashboard; leaving them unset only hides
      # the button. The callback address to register with Google is
      # https://<this service's host>/auth/google/callback/
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # No GEMINI_API_KEY here on purpose: the Django service never calls the model.

  # ---------------------------------------------------------------- Streamlit tutor
  - type: web
    name: hyntor-tutor
    runtime: python
    plan: free
    region: oregon
    # Deploy each commit on main once its CI checks pass; a failing commit is never deployed.
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r tutor_chat/requirements.txt
    # --server.address 0.0.0.0 makes it reachable from outside the container; $PORT is assigned by
    # Render; --server.headless stops Streamlit trying to open a browser on the server.
    startCommand: >-
      streamlit run tutor_chat/tutor.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.15"
      # The same value the Django service generated. Without a match, every token is refused and
      # nobody can get in - which is the correct failure, not an open door.
      - key: HANDOFF_SECRET
        fromService:
          type: web
          name: hyntor-web
          envVarKey: HANDOFF_SECRET
      # The site's PUBLIC address: these links are clicked in a browser, so the internal
      # hostname from `fromService ... property: host` would not resolve (see TUTOR_CHAT_URL above).
      - key: HYNTOR_SITE_URL
        value: https://hyntor-web.onrender.com
      # Set this in the Render dashboard. Until it is set, the tutor says it is not configured
      # rather than crashing.
      - key: GEMINI_API_KEY
        sync: false
